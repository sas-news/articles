<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147d55"/>
    </marker>
    <marker id="arrowNg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687386"/>
    </marker>
  </defs>

  <!-- top: NG case -->
  <text x="40" y="46" font-family="Noto Sans CJK JP" font-size="22" font-weight="500" fill="#b42318">ハマった：SG だけ開けた場合</text>

  <rect x="30" y="80" rx="12" ry="12" width="190" height="110" fill="#f4f5f7" stroke="#9aa6b8" stroke-width="2"/>
  <text x="125" y="128" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="21" fill="#172033">外部から</text>
  <text x="125" y="158" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#687386">25565/tcp</text>

  <line x1="220" y1="135" x2="258" y2="135" stroke="#687386" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <rect x="262" y="80" rx="12" ry="12" width="280" height="110" fill="#e8f7f0" stroke="#147d55" stroke-width="2"/>
  <text x="402" y="122" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="19" font-weight="500" fill="#172033">ConoHa セキュリティグループ</text>
  <text x="402" y="152" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#147d55">25565/tcp 許可 ○</text>

  <line x1="542" y1="135" x2="580" y2="135" stroke="#687386" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <rect x="584" y="80" rx="12" ry="12" width="300" height="110" fill="#fdeceb" stroke="#b42318" stroke-width="2"/>
  <text x="734" y="122" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20" font-weight="500" fill="#172033">OS（Debian 13 テンプレート）</text>
  <text x="734" y="152" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#b42318">nftables: policy drop ×</text>

  <line x1="884" y1="135" x2="925" y2="135" stroke="#b42318" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowNg)"/>
  <text x="905" y="120" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26" font-weight="500" fill="#b42318">×</text>

  <rect x="930" y="80" rx="12" ry="12" width="240" height="110" fill="#f4f5f7" stroke="#9aa6b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1050" y="122" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20" fill="#687386">自宅の Minecraft</text>
  <text x="1050" y="152" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#9aa6b8">届かない…</text>

  <!-- bottom: OK case -->
  <text x="40" y="278" font-family="Noto Sans CJK JP" font-size="22" font-weight="500" fill="#147d55">対処：cloud-init で OS にも同じ許可を入れる</text>

  <rect x="30" y="310" rx="12" ry="12" width="190" height="110" fill="#f4f5f7" stroke="#9aa6b8" stroke-width="2"/>
  <text x="125" y="358" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="21" fill="#172033">外部から</text>
  <text x="125" y="388" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#687386">25565/tcp</text>

  <line x1="220" y1="365" x2="258" y2="365" stroke="#687386" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <rect x="262" y="310" rx="12" ry="12" width="280" height="110" fill="#e8f7f0" stroke="#147d55" stroke-width="2"/>
  <text x="402" y="352" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="19" font-weight="500" fill="#172033">ConoHa セキュリティグループ</text>
  <text x="402" y="382" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#147d55">25565/tcp 許可 ○</text>

  <line x1="542" y1="365" x2="580" y2="365" stroke="#687386" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <rect x="584" y="310" rx="12" ry="12" width="300" height="110" fill="#e8f7f0" stroke="#147d55" stroke-width="2"/>
  <text x="734" y="348" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20" font-weight="500" fill="#172033">OS nftables</text>
  <text x="734" y="376" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#147d55">同じポートを許可 ○</text>
  <text x="734" y="402" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="16" fill="#687386">（cloud-init で自動追加）</text>

  <line x1="884" y1="365" x2="925" y2="365" stroke="#147d55" stroke-width="2.5" marker-end="url(#arrowOk)"/>

  <rect x="930" y="310" rx="12" ry="12" width="240" height="110" fill="#e8f7f0" stroke="#147d55" stroke-width="2"/>
  <text x="1050" y="358" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20" fill="#172033">自宅の Minecraft</text>
  <text x="1050" y="388" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="18" fill="#147d55">届く ○</text>
</svg>
